# XcodeGen 工程描述。生成：`brew install xcodegen && xcodegen generate`（在 ios/ 目录下）。
# Bite.xcodeproj 是生成物，不入库；改工程结构改这个文件。
name: Bite

options:
  bundleIdPrefix: com.sunrise
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.55.0"
  BiteCore:
    path: Packages/BiteCore

settings:
  base:
    DEVELOPMENT_TEAM: $(BITE_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    GENERATE_INFOPLIST_FILE: NO

targets:
  Bite:
    type: application
    platform: iOS
    sources:
      - path: Bite
        excludes:
          - "Info.plist"
      - path: Shared
    dependencies:
      - package: Supabase
        product: Supabase
      - package: BiteCore
      - target: BiteShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BITE_BUNDLE_ID)
        PRODUCT_NAME: Bite
        CODE_SIGN_ENTITLEMENTS: Bite/Bite.entitlements
        INFOPLIST_FILE: Bite/Info.plist
        SUPPORTS_MACCATALYST: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    info:
      path: Bite/Info.plist
      properties:
        CFBundleDisplayName: Bite
        CFBundleName: Bite
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - remote-notification
        CFBundleURLTypes:
          - CFBundleURLName: $(BITE_BUNDLE_ID)
            CFBundleURLSchemes:
              - bite
        LSApplicationQueriesSchemes:
          - xhsdiscover
        NSCameraUsageDescription: 拍菜单 / 店面照片，AI 识别后加进清单；也用来给店铺和造访拍照
        NSPhotoLibraryUsageDescription: 选择店铺 / 造访照片，上传到你自己的清单
        NSLocationWhenInUseUsageDescription: 「附近去哪」按离你的距离排序；搜店名时优先显示附近的店
        NSMicrophoneUsageDescription: 语音输入店铺描述
        NSSpeechRecognitionUsageDescription: 把你说的话转成文字，用来记店
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
        # 下面四个从 Config/*.xcconfig 注入，App 里由 Services/Env.swift 读
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        BITE_API_BASE_URL: $(BITE_API_BASE_URL)
        BITE_APP_GROUP: $(BITE_APP_GROUP)

  BiteShare:
    type: app-extension
    platform: iOS
    sources:
      - path: BiteShare
        excludes:
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BITE_BUNDLE_ID).share
        PRODUCT_NAME: BiteShare
        CODE_SIGN_ENTITLEMENTS: BiteShare/BiteShare.entitlements
        INFOPLIST_FILE: BiteShare/Info.plist
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    info:
      path: BiteShare/Info.plist
      properties:
        CFBundleDisplayName: Bite
        CFBundleName: BiteShare
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BITE_APP_GROUP: $(BITE_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 1

schemes:
  Bite:
    build:
      targets:
        Bite: all
        BiteShare: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: BiteCore/BiteCoreTests
    archive:
      config: Release
